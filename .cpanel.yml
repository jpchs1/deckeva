deployment:
  tasks:
    # ── deckeva.com production root (NEW: light layout, international variant) ──
    # IMPORTANTE: en este servidor el DirectoryIndex prefiere
    # "deckeva-international.html" sobre "index.html" (legacy config). Por eso
    # copiamos el mismo contenido nuevo a AMBOS archivos para que la raiz
    # (/) y /index.html y /deckeva-international.html sirvan todos lo mismo.
    - /bin/cp staging/index-com.html /home/wwimpo/deckeva.com/index.html
    - /bin/cp staging/index-com.html /home/wwimpo/deckeva.com/deckeva-international.html

    # ── Favicons / iconos web-app (raíz de AMBOS dominios) ──
    # Set completo del emblema DECKEVA (barco): favicon.ico multi-tamaño,
    # favicon.svg, PNG 16/32/48/96/192/512, apple-touch-icon, iconos maskable,
    # mstile, site.webmanifest y browserconfig.xml. Se copian a la raíz para
    # que /favicon.ico, /favicon.svg, /apple-touch-icon.png, /site.webmanifest,
    # etc. resuelvan correctamente y se vean perfecto en navegador, Google,
    # iOS, Android y Windows.
    - /bin/mkdir -p /home/wwimpo/deckeva.com /home/wwimpo/deckeva.cl
    - /bin/cp -R assets/icons/. /home/wwimpo/deckeva.com/
    - /bin/cp -R assets/icons/. /home/wwimpo/deckeva.cl/

    # ── Subpaths existentes ──
    # Guías DECKEVA: índice + "Cómo medir" (/guia/medir/) + "Cómo instalar"
    # (/guia/instalar/). Ambas subpáginas comparten styles.css y script.js del
    # directorio padre, por eso también se sincronizan aquí.
    - /bin/mkdir -p /home/wwimpo/deckeva.com/guia/medir /home/wwimpo/deckeva.com/guia/instalar
    - /bin/cp guia/index.html /home/wwimpo/deckeva.com/guia/index.html
    - /bin/cp guia/styles.css /home/wwimpo/deckeva.com/guia/styles.css
    - /bin/cp guia/script.js /home/wwimpo/deckeva.com/guia/script.js
    - /bin/cp guia/medir/index.html /home/wwimpo/deckeva.com/guia/medir/index.html
    - /bin/cp guia/instalar/index.html /home/wwimpo/deckeva.com/guia/instalar/index.html
    - /bin/mkdir -p /home/wwimpo/deckeva.com/wiretransfers
    - /bin/cp wiretransfers/index.html /home/wwimpo/deckeva.com/wiretransfers/index.html

    # ── Portal de Pago (Webpay + Mercado Pago + PayPal) ──
    # Se despliega en AMBOS dominios (.com y .cl) — el canonical es .cl pero el
    # tráfico viene a ambos. webpay-return.php es el shim POST→GET que recibe
    # el callback de Transbank y redirige al JS con ?webpay_token=...
    - /bin/mkdir -p /home/wwimpo/deckeva.com/pago
    - /bin/cp pago/index.html           /home/wwimpo/deckeva.com/pago/index.html
    - /bin/cp pago/deckeva-pago.css     /home/wwimpo/deckeva.com/pago/deckeva-pago.css
    - /bin/cp pago/deckeva-pago.js      /home/wwimpo/deckeva.com/pago/deckeva-pago.js
    - /bin/cp pago/webpay-return.php    /home/wwimpo/deckeva.com/pago/webpay-return.php
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/pago
    - /bin/cp pago/index.html           /home/wwimpo/deckeva.cl/pago/index.html
    - /bin/cp pago/deckeva-pago.css     /home/wwimpo/deckeva.cl/pago/deckeva-pago.css
    - /bin/cp pago/deckeva-pago.js      /home/wwimpo/deckeva.cl/pago/deckeva-pago.js
    - /bin/cp pago/webpay-return.php    /home/wwimpo/deckeva.cl/pago/webpay-return.php

    # ── Staging preview (no indexable, sigue activo para iteraciones) ──
    - /bin/mkdir -p /home/wwimpo/deckeva.com/staging
    - /bin/cp staging/index.html /home/wwimpo/deckeva.com/staging/index.html
    - /bin/cp staging/.htaccess /home/wwimpo/deckeva.com/staging/.htaccess
    - /bin/cp staging/robots.txt /home/wwimpo/deckeva.com/staging/robots.txt

    # ── Imágenes lifestyle (galería ls2 "Tu Embarcación · Otra Dimensión") ──
    # Compartidas entre .com y .cl, servidas desde deckeva.com como CDN.
    - /bin/mkdir -p /home/wwimpo/deckeva.com/staging/img/lifestyle
    - /bin/cp -R staging/img/lifestyle/. /home/wwimpo/deckeva.com/staging/img/lifestyle/

    # ── Previews production-ready (validación pública con cliente) ──
    - /bin/mkdir -p /home/wwimpo/deckeva.com/preview-2026
    - /bin/cp staging/index-com.html /home/wwimpo/deckeva.com/preview-2026/index.html
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/preview-2026
    - /bin/cp staging/index-cl.html /home/wwimpo/deckeva.cl/preview-2026/index.html

    # ── deckeva.cl (WordPress) — sincroniza functions.php y mu-plugins ──
    - /bin/cp wp-content/themes/dt-the7-child/functions.php /home/wwimpo/deckeva.cl/wp-content/themes/dt-the7-child/functions.php 2>/dev/null || true
    - /bin/cp -R wp-content/mu-plugins /home/wwimpo/deckeva.cl/wp-content/ 2>/dev/null || true

    # ── deckeva.cl HOME estática (variante Chile-local) ──
    # Reemplaza el index render de WordPress en la home /. WP sigue rindiendo
    # /wp-admin/, /blog/*, /category/*, etc. via mod_rewrite. Solo / cambia.
    - /bin/cp staging/index-cl.html /home/wwimpo/deckeva.cl/index.html

    # ── Post Imporlan: artículo estático que reemplaza el render WP ──
    # URL: /conoce-imporlan-importacion-de-lanchas-y-embarcaciones-desde-usa-a-chile/
    # Al poner index.html en ese path, mod_rewrite de WP no agarra (RewriteCond
    # !-d se vuelve falso porque el dir EXISTE y tiene index.html).
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/conoce-imporlan-importacion-de-lanchas-y-embarcaciones-desde-usa-a-chile
    - /bin/cp staging/post-imporlan.html /home/wwimpo/deckeva.cl/conoce-imporlan-importacion-de-lanchas-y-embarcaciones-desde-usa-a-chile/index.html

    # ── Post Servicio Técnico Eléctrico Náutico ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/servicio-tecnico-electrico-nautico-para-lanchas-y-embarcaciones-deckeva-chile
    - /bin/cp staging/post-servicio-tecnico-electrico-nautico-para-lanchas-y-embarcaciones-deckeva-chile.html /home/wwimpo/deckeva.cl/servicio-tecnico-electrico-nautico-para-lanchas-y-embarcaciones-deckeva-chile/index.html

    # ── Post Remodelaciones / Restauración Lanchas Santiago ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/restauracion-de-lanchas-en-santiago-chile
    - /bin/cp staging/post-restauracion-de-lanchas-en-santiago-chile.html /home/wwimpo/deckeva.cl/restauracion-de-lanchas-en-santiago-chile/index.html

    # ── Post ¿Qué es Sea Dek? ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/que-es-sea-dek
    - /bin/cp staging/post-que-es-sea-dek.html /home/wwimpo/deckeva.cl/que-es-sea-dek/index.html

    # ── Post ¿Por qué elegir Goma EVA? ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/por-que-elegir-pisos-de-goma-eva-para-mi-lancha
    - /bin/cp staging/post-por-que-elegir-pisos-de-goma-eva-para-mi-lancha.html /home/wwimpo/deckeva.cl/por-que-elegir-pisos-de-goma-eva-para-mi-lancha/index.html

    # ── Post ¿Por qué piso antideslizante? ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/por-que-necesitas-un-piso-antideslizante-para-tu-lancha
    - /bin/cp staging/post-por-que-necesitas-un-piso-antideslizante-para-tu-lancha.html /home/wwimpo/deckeva.cl/por-que-necesitas-un-piso-antideslizante-para-tu-lancha/index.html

    # ── Page Imporlan (landing del servicio Imporlan) ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/imporlan
    - /bin/cp staging/page-imporlan.html /home/wwimpo/deckeva.cl/imporlan/index.html

    # ── Page Blog (index de los 6 articulos) ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/blog
    - /bin/cp staging/page-blog.html /home/wwimpo/deckeva.cl/blog/index.html

    # ── Page Proyectos (galeria de proyectos realizados) ──
    - /bin/mkdir -p /home/wwimpo/deckeva.cl/proyectos
    - /bin/cp staging/page-proyectos.html /home/wwimpo/deckeva.cl/proyectos/index.html
