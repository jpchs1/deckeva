name: Diagnóstico del servidor (FTP)

# Lee por FTP el estado del servidor, los últimos errores fatales de PHP y los
# fallos de correo que registró la web. Solo lee: no sube ni borra nada.
#
# Para cuando WordPress muestra "Ha habido un error crítico", o un correo no
# llega, y no hay SSH para mirar el log. El repo es público: el script imprime
# solo errores fatales y avisos propios recortados, con correos e IPs tapados
# (ver .github/deploy/diagnostico.sh).

on:
  workflow_dispatch:
    inputs:
      lineas:
        description: "Cuántas líneas finales de errores y avisos mostrar por archivo"
        default: "30"

permissions:
  contents: read

jobs:
  diagnostico:
    name: Leer el estado del servidor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      - name: Estado y errores recientes
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
          FTP_BASE: ${{ vars.FTP_BASE }}
          FTP_VERIFICAR_CERT: ${{ vars.FTP_VERIFICAR_CERT }}
          LINEAS: ${{ inputs.lineas }}
        run: bash .github/deploy/diagnostico.sh
